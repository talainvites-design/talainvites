<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Invited — Tala Invites</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/assets/logo-monogram.png">

  <script>
    const CLIENT = {

      eyebrow:        "You are cordially invited to",
      event_type:     "A Birthday Celebration",
      name_line_1:    "Sofia",
      age:            "18",
      age_label:      "years of grace & beauty",
      date:           "Friday · 20 August 2025",
      time:           "Seven in the evening",
      venue:          "The Peninsula Manila",
      location:       "Makati City, Philippines",
      dresscode:      "Black Tie",
      note:           "",
      maps_url:       "https://maps.google.com/?q=The+Peninsula+Manila+Makati",
      countdown_date: "2025-08-20T19:00:00",

      /* ── Photos ──
         PAHIWATIG RULE: Framed only. No full-bleed backgrounds.
         1 photo max for this preset.
         Appears as a bordered portrait frame beside the name block.
         Leave src: "" to hide the frame entirely. */
      photos: [
        { src: "https://res.cloudinary.com/woqclpcw/image/upload/v1788231003/pexels-marcus-queiroga-silva-86421404-29850170.jpg", alt: "Sofia" },
      ],

      theme: {
        bg:             "#1C1712",
        surface:        "#221D17",
        border:         "#C9A84C",
        border_muted:   "rgba(201,168,76,0.2)",
        border_faint:   "rgba(201,168,76,0.08)",
        accent:         "#C9A84C",
        accent_muted:   "rgba(201,168,76,0.35)",
        text_primary:   "#FAF7F2",
        text_secondary: "rgba(250,247,242,0.7)",
        text_muted:     "#8B7D6B",
        name_color:     "#FAF7F2",
        age_color:      "#C9A84C",
        vline_color:    "rgba(201,168,76,0.35)",
        photo_border:   "rgba(201,168,76,0.25)",
        photo_shadow:   "rgba(0,0,0,0.4)",
      },

      watermark: "Crafted by Tala Invites · talainvites@gmail.com",
    };
  </script>

  <style>
    /* ============================================================
       PAHIWATIG — PRESET B: DARK "The Modern"
       Left-aligned layout with vertical gold rule.
       FRAMED PHOTOS ONLY — photo appears as a bordered portrait
       frame to the right of the name block, never full-bleed.
       ============================================================ */

    :root {
      --bg:             #1C1712;
      --surface:        #221D17;
      --border:         #C9A84C;
      --border-muted:   rgba(201,168,76,0.2);
      --border-faint:   rgba(201,168,76,0.08);
      --accent:         #C9A84C;
      --accent-muted:   rgba(201,168,76,0.35);
      --text-primary:   #FAF7F2;
      --text-secondary: rgba(250,247,242,0.7);
      --text-muted:     #8B7D6B;
      --name-color:     #FAF7F2;
      --age-color:      #C9A84C;
      --vline-color:    rgba(201,168,76,0.35);
      --photo-border:   rgba(201,168,76,0.25);
      --photo-shadow:   rgba(0,0,0,0.4);
      --lora:           'Lora', Georgia, serif;
      --poppins:        'Poppins', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--poppins);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .invitation {
      width: 100%;
      max-width: 520px;
      animation: fadeIn 0.9s ease both;
    }

    .top-bar { width: 40px; height: 1.5px; background: var(--accent); margin-bottom: 2.5rem; }

    /* ── Main layout: vline + text + optional photo frame ── */
    .content-wrap {
      display: grid;
      grid-template-columns: 2px 1fr;
      gap: 0 1.8rem;
    }

    .vline {
      background: var(--vline-color);
      position: relative;
    }
    .vline::before { content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:var(--accent); }
    .vline::after  { content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent-muted); }

    .text-side { display: flex; flex-direction: column; }

    /* ── FRAMED PHOTO ──
       Sits below the details block, contained and bordered.
       Never bleeds to the background. */
    .photo-frame {
      margin-top: 1.5rem;
      border: 0.5px solid var(--photo-border);
      box-shadow: 0 4px 20px var(--photo-shadow);
      overflow: hidden;
      position: relative;
    }
    .photo-frame-img {
      aspect-ratio: 16/9;
      overflow: hidden;
    }
    .photo-frame-img img { width:100%; height:100%; object-fit:cover; display:block; }

    /* Gold label bar below photo */
    .photo-caption {
      padding: 0.4rem 0.8rem;
      background: var(--surface);
      border-top: 0.5px solid var(--border-faint);
      font-family: var(--poppins);
      font-size: 0.48rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-muted);
    }

    /* ── Typography ── */
    .eyebrow   { font-family:var(--poppins); font-size:0.56rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.5rem; display:block; }
    .event-type{ font-family:var(--poppins); font-size:0.62rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); margin-bottom:0.8rem; display:block; }
    .name      { font-family:var(--lora); font-size:clamp(3rem,10vw,5rem); font-weight:400; font-style:italic; color:var(--name-color); line-height:0.95; display:block; }
    .age       { font-family:var(--lora); font-size:clamp(2.2rem,7vw,3.5rem); font-weight:400; color:var(--age-color); line-height:1; display:block; }
    .age-label { font-family:var(--poppins); font-size:0.62rem; font-weight:300; color:var(--text-muted); letter-spacing:0.08em; display:block; margin:0.2rem 0 1.2rem; }
    .rule      { width:28px; height:0.5px; background:var(--accent); margin:1rem 0; display:block; }
    .details   { display:flex; flex-direction:column; gap:0.25rem; }
    .detail-line { font-family:var(--poppins); font-size:0.7rem; font-weight:300; color:var(--text-muted); line-height:1.7; }
    .detail-line.emphasis { font-family:var(--lora); font-size:0.78rem; color:var(--text-secondary); }
    .dresscode-line { font-family:var(--poppins); font-size:0.54rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-top:0.6rem; display:block; }
    .note-line { font-family:var(--lora); font-size:0.72rem; font-style:italic; color:var(--text-muted); margin-top:0.3rem; display:block; }
    .map-link  { display:inline-block; margin-top:0.8rem; font-family:var(--poppins); font-size:0.54rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted); border-bottom:0.5px solid var(--border-muted); padding-bottom:2px; text-decoration:none; transition:all 0.2s; }
    .map-link:hover { color:var(--accent); border-bottom-color:var(--accent); }

    /* ── Countdown ── */
    .countdown-wrap { margin-top:1.8rem; padding-top:1.2rem; border-top:0.5px solid var(--border-faint); }
    .countdown-label-top { font-family:var(--poppins); font-size:0.48rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:0.8rem; }
    .countdown-grid { display:flex; align-items:flex-start; gap:1.2rem; flex-wrap:wrap; }
    .cd-unit { text-align:left; }
    .cd-num  { font-family:var(--lora); font-size:2.2rem; font-weight:400; color:var(--accent); line-height:1; display:block; }
    .cd-lbl  { font-family:var(--poppins); font-size:0.46rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); display:block; margin-top:3px; }
    .cd-sep  { font-family:var(--lora); font-size:1.8rem; color:var(--border-muted); padding-top:2px; }
    .countdown-expired { font-family:var(--lora); font-size:0.85rem; font-style:italic; color:var(--accent); }

    /* ── Watermark ── */
    .watermark { margin-top:2.5rem; font-family:var(--poppins); font-size:0.44rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--border-muted); }
    .watermark a { color:inherit; text-decoration:none; }
    .watermark a:hover { color:var(--accent); }

    @keyframes fadeIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

  <div class="invitation">
    <div class="top-bar"></div>
    <div class="content-wrap">
      <div class="vline"></div>
      <div class="text-side">

        <span class="eyebrow"    id="eyebrow"></span>
        <span class="event-type" id="event-type"></span>
        <span class="name"       id="name-1"></span>
        <span class="age"        id="age"></span>
        <span class="age-label"  id="age-label"></span>

        <span class="rule"></span>

        <div class="details">
          <span class="detail-line emphasis" id="detail-date"></span>
          <span class="detail-line"          id="detail-time"></span>
          <span class="detail-line"          id="detail-venue"></span>
          <span class="detail-line"          id="detail-location"></span>
        </div>

        <span class="dresscode-line" id="dresscode"></span>
        <span class="note-line"      id="note"></span>
        <a class="map-link" id="map-link" href="#" target="_blank">View on Google Maps →</a>

        <!-- Framed photo — rendered by JS if src provided -->
        <div id="photo-container"></div>

        <div class="countdown-wrap">
          <span class="countdown-label-top">Counting down to the celebration</span>
          <div class="countdown-grid" id="countdown-grid">
            <div class="cd-unit"><span class="cd-num" id="cd-days">--</span><span class="cd-lbl">Days</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-hours">--</span><span class="cd-lbl">Hours</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-minutes">--</span><span class="cd-lbl">Mins</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-seconds">--</span><span class="cd-lbl">Secs</span></div>
          </div>
        </div>

        <div class="watermark" id="watermark"></div>
      </div>
    </div>
  </div>

  <script>
    /* ── Apply theme ── */
    (function() {
      var r = document.documentElement.style;
      var t = CLIENT.theme;
      r.setProperty('--bg',             t.bg);
      r.setProperty('--surface',        t.surface);
      r.setProperty('--border',         t.border);
      r.setProperty('--border-muted',   t.border_muted);
      r.setProperty('--border-faint',   t.border_faint);
      r.setProperty('--accent',         t.accent);
      r.setProperty('--accent-muted',   t.accent_muted);
      r.setProperty('--text-primary',   t.text_primary);
      r.setProperty('--text-secondary', t.text_secondary);
      r.setProperty('--text-muted',     t.text_muted);
      r.setProperty('--name-color',     t.name_color);
      r.setProperty('--age-color',      t.age_color);
      r.setProperty('--vline-color',    t.vline_color);
      r.setProperty('--photo-border',   t.photo_border);
      r.setProperty('--photo-shadow',   t.photo_shadow);
    })();

    /* ── Framed photo — only shown if src provided ── */
    var photo = (CLIENT.photos || [])[0];
    if (photo && photo.src) {
      var container = document.getElementById('photo-container');
      var frame = document.createElement('div');
      frame.className = 'photo-frame';
      frame.innerHTML =
        '<div class="photo-frame-img"><img src="' + photo.src + '" alt="' + (photo.alt || '') + '"></div>' +
        '<div class="photo-caption">' + CLIENT.name_line_1 + ' · ' + CLIENT.date + '</div>';
      container.appendChild(frame);
    }

    /* ── Content ── */
    document.getElementById('eyebrow').textContent         = CLIENT.eyebrow;
    document.getElementById('name-1').textContent          = CLIENT.name_line_1;
    document.getElementById('detail-date').textContent     = CLIENT.date;
    document.getElementById('detail-time').textContent     = CLIENT.time;
    document.getElementById('detail-venue').textContent    = CLIENT.venue;
    document.getElementById('detail-location').textContent = CLIENT.location;
    document.getElementById('map-link').href               = CLIENT.maps_url;
    document.title = CLIENT.name_line_1 + ' — You Are Invited';

    var evtEl = document.getElementById('event-type');
    evtEl.textContent   = CLIENT.event_type;
    evtEl.style.display = CLIENT.event_type ? 'block' : 'none';

    var ageEl  = document.getElementById('age');
    var ageLbl = document.getElementById('age-label');
    if (CLIENT.age) {
      ageEl.textContent  = CLIENT.age;
      ageLbl.textContent = CLIENT.age_label || '';
    } else {
      ageEl.style.display  = 'none';
      ageLbl.style.display = 'none';
    }

    var dcEl = document.getElementById('dresscode');
    dcEl.textContent   = CLIENT.dresscode ? 'Dress Code · ' + CLIENT.dresscode : '';
    dcEl.style.display = CLIENT.dresscode ? 'block' : 'none';

    var noteEl = document.getElementById('note');
    noteEl.textContent   = CLIENT.note;
    noteEl.style.display = CLIENT.note ? 'block' : 'none';

    document.getElementById('watermark').innerHTML =
      CLIENT.watermark.replace('talainvites@gmail.com', '<a href="mailto:talainvites@gmail.com">talainvites@gmail.com</a>');

    /* ── Countdown ── */
    function updateCountdown() {
      var diff = new Date(CLIENT.countdown_date).getTime() - Date.now();
      if (diff <= 0) {
        document.getElementById('countdown-grid').innerHTML = '<span class="countdown-expired">The celebration is here.</span>';
        return;
      }
      document.getElementById('cd-days').textContent    = String(Math.floor(diff / 86400000)).padStart(2,'0');
      document.getElementById('cd-hours').textContent   = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
      document.getElementById('cd-minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
      document.getElementById('cd-seconds').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
