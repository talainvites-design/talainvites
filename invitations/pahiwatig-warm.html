<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You Are Invited — Tala Invites</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/assets/logo-monogram.png">

  <script>
    const CLIENT = {

      eyebrow:        "In celebration of",
      name_line_1:    "Maria",
      name_line_2:    "Jose",
      conjunction:    "&",
      event_type:     "25th Wedding Anniversary",
      date:           "Saturday · 12 October 2025",
      time:           "Six in the evening",
      venue:          "Rockwell Tent",
      location:       "Makati City, Philippines",
      dresscode:      "Cocktail Attire",
      note:           "Dinner and dancing to follow",
      maps_url:       "https://maps.google.com/?q=Rockwell+Tent+Makati",
      countdown_date: "2025-10-12T18:00:00",

      /* ── Photos ──
         PAHIWATIG RULE: Framed only. No full-bleed backgrounds.
         2 photos max. Appear as polaroid-style frames flanking the name.
         Leave src: "" to hide that polaroid entirely. */
      photos: [
        { src: "", alt: "Maria & Jose — Photo 1" },
        { src: "", alt: "Maria & Jose — Photo 2" },
      ],

      theme: {
        bg:             "#F7F0DC",
        frame_bg:       "#FAF7F2",
        border:         "#C9A84C",
        border_muted:   "rgba(201,168,76,0.28)",
        border_inner:   "rgba(61,47,31,0.1)",
        accent:         "#C9A84C",
        accent_warm:    "#B07D5A",
        text_primary:   "#3D2F1F",
        text_secondary: "#5C3D25",
        text_muted:     "#8B7D6B",
        name_color:     "#3D2F1F",
        conj_color:     "#C9A84C",
        photo_bg:       "#FFFFFF",
        photo_shadow:   "rgba(61,47,31,0.12)",
      },

      watermark: "Crafted by Tala Invites · talainvites@gmail.com",
    };
  </script>

  <style>
    /* ============================================================
       PAHIWATIG — PRESET C: WARM "The Intimate"
       Boxed, double-framed layout.
       FRAMED PHOTOS ONLY — polaroid-style frames flank the names.
       Never full-bleed. Photo is always contained within a frame.
       ============================================================ */

    :root {
      --bg:           #F7F0DC;
      --frame-bg:     #FAF7F2;
      --border:       #C9A84C;
      --border-muted: rgba(201,168,76,0.28);
      --border-inner: rgba(61,47,31,0.1);
      --accent:       #C9A84C;
      --accent-warm:  #B07D5A;
      --text-primary:   #3D2F1F;
      --text-secondary: #5C3D25;
      --text-muted:     #8B7D6B;
      --name-color:   #3D2F1F;
      --conj-color:   #C9A84C;
      --photo-bg:     #FFFFFF;
      --photo-shadow: rgba(61,47,31,0.12);
      --lora:         'Lora', Georgia, serif;
      --poppins:      'Poppins', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--poppins);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .invitation {
      width: 100%;
      max-width: 500px;
      animation: fadeIn 0.8s ease both;
    }

    /* ── Outer border ── */
    .frame-outer {
      border: 1px solid var(--border-muted);
      padding: 2rem;
      background: var(--frame-bg);
      position: relative;
    }
    /* Inner subtle rule */
    .frame-outer::before {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 0.5px solid var(--border-inner);
      pointer-events: none;
    }

    .frame-inner { text-align: center; position: relative; z-index: 1; }

    /* ── POLAROID PHOTO FRAMES ── */
    .name-photo-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    /* When no photos at all — collapse side columns */
    .name-photo-row.no-photos {
      grid-template-columns: 1fr;
    }
    .name-photo-row.no-photos .polaroid { display: none; }

    /* Polaroid frame — white background with bottom caption space */
    .polaroid {
      background: var(--photo-bg);
      padding: 0.35rem 0.35rem 1.1rem;
      box-shadow: 0 3px 10px var(--photo-shadow);
      border: 0.5px solid rgba(201,168,76,0.15);
    }
    .polaroid.left  { transform: rotate(-2.5deg); }
    .polaroid.right { transform: rotate(2deg); }
    .polaroid.hidden { visibility: hidden; }

    .polaroid-img {
      aspect-ratio: 3/4;
      overflow: hidden;
      background: var(--bg);
    }
    .polaroid-img img { width:100%; height:100%; object-fit:cover; display:block; }

    /* ── Name block ── */
    .name-block { text-align: center; }
    .name        { font-family:var(--lora); font-size:clamp(1.8rem,7vw,2.8rem); font-weight:400; font-style:italic; color:var(--name-color); line-height:1.05; display:block; }
    .conjunction { font-family:var(--lora); font-size:0.9rem; color:var(--conj-color); display:block; margin:0.2rem 0; }

    /* ── Typography ── */
    .orn       { font-size:0.52rem; letter-spacing:0.3em; color:var(--accent); margin-bottom:0.8rem; display:block; }
    .eyebrow   { font-family:var(--poppins); font-size:0.56rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); margin-bottom:0.5rem; display:block; }
    .event-type{ font-family:var(--lora); font-size:0.82rem; font-style:italic; color:var(--accent-warm); margin-bottom:1rem; display:block; }
    .rule      { width:30px; height:0.5px; background:var(--accent); margin:1rem auto; display:block; }
    .details   { display:flex; flex-direction:column; gap:0.25rem; }
    .detail-line { font-family:var(--poppins); font-size:0.7rem; font-weight:300; color:var(--text-muted); line-height:1.7; }
    .detail-line.emphasis { font-family:var(--lora); font-size:0.78rem; color:var(--text-secondary); }
    .dresscode-line { font-family:var(--poppins); font-size:0.54rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-top:0.6rem; display:block; }
    .note-line { font-family:var(--lora); font-size:0.72rem; font-style:italic; color:var(--text-muted); margin-top:0.3rem; display:block; }
    .map-link  { display:inline-block; margin-top:0.8rem; font-family:var(--poppins); font-size:0.54rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted); border-bottom:0.5px solid var(--border-muted); padding-bottom:2px; text-decoration:none; transition:all 0.2s; }
    .map-link:hover { color:var(--accent); border-bottom-color:var(--accent); }

    /* ── Countdown ── */
    .countdown-wrap { margin-top:1.4rem; padding-top:1.1rem; border-top:0.5px solid var(--border-muted); }
    .countdown-label-top { font-family:var(--poppins); font-size:0.48rem; letter-spacing:0.22em; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:0.8rem; }
    .countdown-grid { display:flex; justify-content:center; align-items:flex-start; gap:0.9rem; flex-wrap:wrap; }
    .cd-unit { text-align:center; }
    .cd-num  { font-family:var(--lora); font-size:1.7rem; font-weight:400; color:var(--accent-warm); line-height:1; display:block; }
    .cd-lbl  { font-family:var(--poppins); font-size:0.46rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); display:block; margin-top:3px; }
    .cd-sep  { font-family:var(--lora); font-size:1.4rem; color:var(--border-muted); padding-top:2px; }
    .countdown-expired { font-family:var(--lora); font-size:0.85rem; font-style:italic; color:var(--accent); }

    /* ── Watermark ── */
    .watermark { margin-top:1.4rem; font-family:var(--poppins); font-size:0.44rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--border-muted); text-align:center; }
    .watermark a { color:inherit; text-decoration:none; }
    .watermark a:hover { color:var(--accent); }

    @keyframes fadeIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>

  <div class="invitation">
    <div class="frame-outer">
      <div class="frame-inner">

        <span class="orn">· ·</span>
        <span class="eyebrow"    id="eyebrow"></span>
        <span class="event-type" id="event-type"></span>

        <!-- Polaroid photos flank the name -->
        <div class="name-photo-row" id="name-photo-row">
          <div class="polaroid left" id="polaroid-left">
            <div class="polaroid-img"><img id="photo-left" src="" alt=""></div>
          </div>
          <div class="name-block">
            <span class="name"        id="name-1"></span>
            <span class="conjunction" id="conjunction"></span>
            <span class="name"        id="name-2"></span>
          </div>
          <div class="polaroid right" id="polaroid-right">
            <div class="polaroid-img"><img id="photo-right" src="" alt=""></div>
          </div>
        </div>

        <span class="rule"></span>

        <div class="details">
          <span class="detail-line emphasis" id="detail-date"></span>
          <span class="detail-line"          id="detail-time"></span>
          <span class="detail-line"          id="detail-venue"></span>
          <span class="detail-line"          id="detail-location"></span>
        </div>

        <span class="dresscode-line" id="dresscode"></span>
        <span class="note-line"      id="note"></span>
        <a class="map-link" id="map-link" href="#" target="_blank">View on Google Maps →</a>

        <div class="countdown-wrap">
          <span class="countdown-label-top">Counting down to the celebration</span>
          <div class="countdown-grid" id="countdown-grid">
            <div class="cd-unit"><span class="cd-num" id="cd-days">--</span><span class="cd-lbl">Days</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-hours">--</span><span class="cd-lbl">Hours</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-minutes">--</span><span class="cd-lbl">Mins</span></div>
            <div class="cd-sep">·</div>
            <div class="cd-unit"><span class="cd-num" id="cd-seconds">--</span><span class="cd-lbl">Secs</span></div>
          </div>
        </div>

      </div>
    </div>
    <div class="watermark" id="watermark"></div>
  </div>

  <script>
    /* ── Apply theme ── */
    (function() {
      var r = document.documentElement.style;
      var t = CLIENT.theme;
      r.setProperty('--bg',             t.bg);
      r.setProperty('--frame-bg',       t.frame_bg);
      r.setProperty('--border',         t.border);
      r.setProperty('--border-muted',   t.border_muted);
      r.setProperty('--border-inner',   t.border_inner);
      r.setProperty('--accent',         t.accent);
      r.setProperty('--accent-warm',    t.accent_warm);
      r.setProperty('--text-primary',   t.text_primary);
      r.setProperty('--text-secondary', t.text_secondary);
      r.setProperty('--text-muted',     t.text_muted);
      r.setProperty('--name-color',     t.name_color);
      r.setProperty('--conj-color',     t.conj_color);
      r.setProperty('--photo-bg',       t.photo_bg);
      r.setProperty('--photo-shadow',   t.photo_shadow);
    })();

    /* ── Polaroid photos ──
       Each polaroid only shows if src is provided.
       If both empty → name row collapses to single column. */
    var photos = CLIENT.photos || [];
    var leftPhoto  = photos[0];
    var rightPhoto = photos[1];
    var leftEl  = document.getElementById('polaroid-left');
    var rightEl = document.getElementById('polaroid-right');
    var row     = document.getElementById('name-photo-row');

    if (leftPhoto && leftPhoto.src) {
      document.getElementById('photo-left').src = leftPhoto.src;
      document.getElementById('photo-left').alt = leftPhoto.alt || '';
    } else {
      leftEl.style.display = 'none';
    }

    if (rightPhoto && rightPhoto.src) {
      document.getElementById('photo-right').src = rightPhoto.src;
      document.getElementById('photo-right').alt = rightPhoto.alt || '';
    } else {
      rightEl.style.display = 'none';
    }

    /* If neither photo is present, collapse to name-only */
    if ((!leftPhoto || !leftPhoto.src) && (!rightPhoto || !rightPhoto.src)) {
      row.className = 'name-photo-row no-photos';
    }

    /* ── Content ── */
    document.getElementById('eyebrow').textContent         = CLIENT.eyebrow;
    document.getElementById('name-1').textContent          = CLIENT.name_line_1;
    document.getElementById('conjunction').textContent     = CLIENT.conjunction;
    document.getElementById('name-2').textContent          = CLIENT.name_line_2;
    document.getElementById('detail-date').textContent     = CLIENT.date;
    document.getElementById('detail-time').textContent     = CLIENT.time;
    document.getElementById('detail-venue').textContent    = CLIENT.venue;
    document.getElementById('detail-location').textContent = CLIENT.location;
    document.getElementById('map-link').href               = CLIENT.maps_url;
    document.title = CLIENT.name_line_1 + ' & ' + CLIENT.name_line_2 + ' — You Are Invited';

    var evtEl = document.getElementById('event-type');
    evtEl.textContent   = CLIENT.event_type;
    evtEl.style.display = CLIENT.event_type ? 'block' : 'none';

    var dcEl = document.getElementById('dresscode');
    dcEl.textContent   = CLIENT.dresscode ? 'Dress Code · ' + CLIENT.dresscode : '';
    dcEl.style.display = CLIENT.dresscode ? 'block' : 'none';

    var noteEl = document.getElementById('note');
    noteEl.textContent   = CLIENT.note;
    noteEl.style.display = CLIENT.note ? 'block' : 'none';

    document.getElementById('watermark').innerHTML =
      CLIENT.watermark.replace('talainvites@gmail.com', '<a href="mailto:talainvites@gmail.com">talainvites@gmail.com</a>');

    /* ── Countdown ── */
    function updateCountdown() {
      var diff = new Date(CLIENT.countdown_date).getTime() - Date.now();
      if (diff <= 0) {
        document.getElementById('countdown-grid').innerHTML = '<span class="countdown-expired">The celebration is here.</span>';
        return;
      }
      document.getElementById('cd-days').textContent    = String(Math.floor(diff / 86400000)).padStart(2,'0');
      document.getElementById('cd-hours').textContent   = String(Math.floor((diff % 86400000) / 3600000)).padStart(2,'0');
      document.getElementById('cd-minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2,'0');
      document.getElementById('cd-seconds').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
